<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Taza Cerámica Sublimada">
  <rect width="800" height="600" fill="#F4EFE6"/>
  <!-- Mug Shadow -->
  <ellipse cx="400" cy="460" rx="140" ry="25" fill="#0D0F14" opacity="0.1"/>
  <!-- Mug Handle -->
  <path d="M470 230 C560 230 560 380 470 380" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" fill="none"/>
  <path d="M470 230 C560 230 560 380 470 380" stroke="#D5D7DF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Mug Body -->
  <rect x="290" y="190" width="220" height="240" rx="20" fill="#FFFFFF" stroke="#EAEBEF" stroke-width="3"/>
  <!-- Sublimation Artwork on Mug -->
  <rect x="315" y="230" width="170" height="150" rx="6" fill="#0D0F14"/>
  <circle cx="400" cy="290" r="30" fill="#E8392B"/>
  <text x="350" y="345" font-family="'Bodoni Moda', serif" font-size="16" font-weight="bold" fill="#F4EFE6">TINTORA</text>
  <text x="355" y="362" font-family="'DM Sans', sans-serif" font-size="9" fill="#C9A96A">MADRID ESTUDIO</text>
  <!-- Mug Rim -->
  <ellipse cx="400" cy="190" rx="110" ry="20" fill="#F5F6F8" stroke="#D5D7DF" stroke-width="2"/>
  <ellipse cx="400" cy="190" rx="98" ry="14" fill="#3D372F"/>
</svg>
