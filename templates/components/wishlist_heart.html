{% load i18n %}
{# Wishlist heart toggle — returned by customer:toggle_wishlist and rendered on product cards. Server-computed state, HTMX swaps the whole button. #}
<button type="button"
        hx-post="{% url 'customer:toggle_wishlist' product.id %}"
        hx-target="this"
        hx-swap="outerHTML"
        class="p-2 border transition-colors {% if wished %}border-vermilion/40 bg-vermilion/10 text-vermilion{% else %}border-ink/10 dark:border-paper/15 text-ink-400 dark:text-paper-500 hover:text-vermilion hover:border-vermilion/40{% endif %}"
        aria-pressed="{% if wished %}true{% else %}false{% endif %}"
        aria-label="{% if wished %}{% trans 'Quitar de la lista de deseos' %}{% else %}{% trans 'Añadir a la lista de deseos' %}{% endif %}">
  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="{% if wished %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
  </svg>
</button>
