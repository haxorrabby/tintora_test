{% load i18n %}
<!-- Search Modal with HTMX Instant Autocomplete -->
<div x-data="{ open: false }" 
     @open-search.window="open = true; $nextTick(() => $refs.searchInput.focus())"
     @keydown.window.escape="open = false"
     @keydown.window.slash.prevent="open = true; $nextTick(() => $refs.searchInput.focus())"
     x-show="open" 
     class="fixed inset-0 z-50 overflow-y-auto bg-ink/80 backdrop-blur-sm p-4 sm:p-6 md:p-20"
     style="display: none;"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">

  <div class="max-w-2xl mx-auto glass-search overflow-hidden"
       @click.away="open = false">
    
    <!-- Search Bar Form -->
    <div class="relative hairline-b flex items-center px-4">
      <svg class="w-5 h-5 text-ink-400 dark:text-paper-500 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" 
             x-ref="searchInput"
             name="q"
             hx-get="{% url 'catalog:search' %}" 
             hx-trigger="keyup changed delay:250ms, search" 
             hx-target="#search-results" 
             hx-indicator="#search-loading"
             placeholder="{% trans 'Buscar tarjetas, tazas, café, harina, roll-ups...' %}"
             class="w-full bg-transparent py-4 text-sm text-ink dark:text-paper placeholder:text-ink-400 dark:placeholder:text-paper-500 border-none focus:ring-0 focus:outline-none">
      
      <div id="search-loading" class="htmx-indicator pr-2">
        <span class="inline-block w-4 h-4 border-2 border-vermilion border-t-transparent rounded-full animate-spin"></span>
      </div>

      <button @click="open = false" class="text-xs font-mono px-2 py-1 bg-ink/5 dark:bg-paper/5 text-ink-500 dark:text-paper-400 hover:text-ink">
        {% trans "ESC" %}
      </button>
    </div>

    <!-- Live Results Container -->
    <div id="search-results" class="p-6 max-h-[60vh] overflow-y-auto">
      <div class="text-center py-6 text-xs text-ink-500 dark:text-paper-400 font-mono">
        {% trans "Escribe al menos 2 caracteres para buscar en el catálogo de Madrid..." %}
      </div>
    </div>

    <!-- Search Footer with Quick Hints -->
    <div class="px-4 py-2.5 bg-surface-light dark:bg-surface-subtleDark hairline-t flex items-center justify-between text-[11px] font-mono text-ink-500 dark:text-paper-400">
      <span>{% trans "Pulsa" %} <kbd class="px-1.5 py-0.5 bg-paper dark:bg-ink border border-ink/20 dark:border-paper/20 rounded">{% trans "ESC" %}</kbd> {% trans "para cerrar" %}</span>
      <span class="hidden sm:inline">{% trans "Filtro en tiempo real con HTMX" %}</span>
    </div>

  </div>
</div>
