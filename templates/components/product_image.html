{% load i18n static %}
<div data-product-image-frame
     class="product-image-frame {{ image_frame_class|default:'aspect-square' }} relative flex items-center justify-center overflow-hidden {{ image_background_class|default:'bg-paper-100 dark:bg-paper-200' }}">
  {% if image_src and "tintora-logo-mono.svg" not in image_src %}
  <img data-product-image
       src="{% if image_static %}{% static image_src %}{% else %}{{ image_src }}{% endif %}"
       alt="{{ image_alt|default:'' }}"
       loading="{{ image_loading|default:'lazy' }}"
       decoding="async"
       {% if image_id %}id="{{ image_id }}"{% endif %}
       {% if image_bind_src %}x-bind:src="{{ image_bind_src }}"{% endif %}
       class="product-image-content block max-h-full max-w-full object-contain object-center {{ image_padding_class|default:'p-3 sm:p-4' }}">
  {% endif %}
  <div data-product-image-fallback
       {% if image_src and "tintora-logo-mono.svg" not in image_src %}hidden{% endif %}
       class="{% if image_src and 'tintora-logo-mono.svg' not in image_src %}hidden {% endif %}absolute inset-0 flex flex-col items-center justify-center gap-2 p-3 text-center text-xs text-ink-400 dark:text-paper-500"
       role="img"
       aria-label="{% trans 'Imagen no disponible' %}">
    <svg class="h-8 w-8 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.5" />
      <circle cx="8.5" cy="8.5" r="1.5" stroke-width="1.5" />
      <path d="m21 15-5-5L5 21" stroke-width="1.5" />
    </svg>
    <span>{% trans "Imagen no disponible" %}</span>
  </div>
</div>
