upstream tintora_web {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tintora.es www.tintora.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tintora.es www.tintora.es;

    ssl_certificate /etc/letsencrypt/live/tintora.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tintora.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TintoraTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 52m;
    server_tokens off;

    location /static/ {
        alias /srv/tintora-static/;
        access_log off;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://tintora_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}